<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>购物车页面</title>   
</head>  
<style>
    body {  
    font-family: Arial, sans-serif;  
    background-color: #f4f4f4;  
    margin: 0;  
    padding: 20px;  
}  
  
.container {  
    max-width: 800px;  
    /* margin: 0 auto;   */
    background-color: #fff;  
    padding: 20px;  
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);  
    border-radius: 8px;  
}  
  
h1 {  
    text-align: center;  
}  
  
.cart-items {  
    display: flex;  
    flex-direction: column;  
    gap: 20px;  
}  
  
.cart-item {  
    display: flex;  
    align-items: center;  
    gap: 20px;  
    padding: 10px;  
    border: 1px solid #ddd;  
    border-radius: 8px;  
    background-color: #fafafa;  
}  
  
.product-image {  
    width: 100px;  
    height: 100px;  
    object-fit: cover;  
    border-radius: 8px;  
}  
  
.item-details {  
    flex: 1;  
}  
  
.item-details h2 {  
    margin: 0 0 5px;  
}  
  
.item-details p {  
    margin: 0;  
}  
  
.label {  
    margin-right: 10px;  
}  
  
.total-price {  
    text-align: center;  
    margin-top: 20px;  
}  
  
#checkout-btn {  
    display: block;  
    width: 100%;  
    max-width: 200px;  
    margin: 20px auto 0;  
    padding: 10px;  
    background-color: #28a745;  
    color: #fff;  
    border: none;  
    border-radius: 8px;  
    cursor: pointer;  
    font-size: 16px;  
}  
  
#checkout-btn:hover {  
    background-color: #218838;  
}
.none{
    width: 800px;
    color: red;
    background-color: gray;
}
.echarts-box{
    position: absolute;
    top: 60px;
    right: 10px;
    margin-top: 30px;
}
</style>
<body>  
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>

    <div id="app">
        <div class="container">  
            <h1>购物车</h1>  
            <div class="cart-items" v-if="list.length > 0"> 
                <!--  -->
                <div class="cart-item" v-for="(item,index) in list" :key="item.id" >  
                    <img :src=item.picture alt="商品1" class="product-image">  
                    <div class="item-details">  
                        <h2>{{item.pdname}}</h2> 

                        <p>价格: <span class="price">{{item.pdprice}}</span></p> 

                        <button @click="Add(item.id)">+</button>

                        <label for="quantity1">{{item.pdnum}}</label>  

                        <button :disabled="item.pdnum <= 1" @click="Reduce(item.id)">-</button>

                        <input type="checkbox" v-model="item.IsCheckout">

                        <button @click="Delpd(item.id)">删除</button>
                    </div>  
                </div>  

                <!-- 可以添加更多商品项 -->  

            </div>  

            <div class="none" v-else>
                <p>无数据</p>
            </div>


            <div class="total-price">  

                <h2>总价: <span id="total">{{TotalPrice}}</span></h2>  
                <h2>总数：<span>{{TotalCount}}</span></h2>

                <input type="checkbox" v-model="IsAll">

                <span>全选</span>
            </div>  


            <button id="checkout-btn" @click="CheckOut">结账</button>    
    
        </div> 
        <div class="echarts-box" id="main" style="width: 600px;height:400px;"></div>
    </div> 
    <script>
        const defaultList =  [
                    {id:1,pdname:'笔记本电脑',pdprice:6666,pdnum:1,IsCheckout:true,picture: 'https://yanxuan-item.nosdn.127.net/84a59ff9c58a77032564e61f716846d6.jpg'},
                    {id:2,pdname:'洗衣机',pdprice:666,pdnum:1,IsCheckout:true,picture: 'https://yanxuan-item.nosdn.127.net/3346b7b92f9563c7a7e24c7ead883f18.jpg',},
                    {id:3,pdname:'手机',pdprice:16666,pdnum:1,IsCheckout:true,picture: 'https://yanxuan-item.nosdn.127.net/2d942d6bc94f1e230763e1a5a3b379e1.png'},
                    {id:4,pdname:'电饭煲',pdprice:566,pdnum:1,IsCheckout:true,picture: 'https://yanxuan-item.nosdn.127.net/44e51622800e4fceb6bee8e616da85fd.png'}
                ]
        const app = new Vue({
            el:'#app',
            data:{
                list : JSON.parse(localStorage.getItem('list')) || defaultList
            },
            computed:{
                //复选框的全选和反选
                IsAll:{
                    get(){
                        return this.list.every(item => item.IsCheckout)
                },
                    set(value){
                        return this.list.forEach(item => item.IsCheckout = value)   
                    }
                },
                //统计总数量
                TotalCount(){
                    return this.list.reduce((sum,item) => {
                        if(item.IsCheckout){
                            return sum + item.pdnum
                        }else{
                            return sum
                        }
                    },0)
                },
                //统计总金额
                TotalPrice(){
                    return this.list.reduce((sum,item) => {
                        if(item.IsCheckout){
                            return sum + item.pdnum * item.pdprice
                        }else{
                            return sum
                        }
                    },0)
                }
                
            },
            mounted(){
                this.myChart = echarts.init(document.querySelector('#main'))
                this.updateChartData()
            },
            methods:{
                //删除商品
                Delpd(ID){
                    this.list = this.list.filter(item => item.id !== ID)
                    this.updateChartData();
                },
                //商品数量的增加与删除
                Add(Id){
                    const ControlPdNum = this.list.find(item => item.id === Id)
                    ControlPdNum.pdnum++
                    this.updateChartData();
                },
                Reduce(Id){
                    const ControlPdNum = this.list.find(item => item.id === Id)
                    ControlPdNum.pdnum-- 
                    this.updateChartData();                
                },
                CheckOut(){
                    alert(`结账总金额：${this.TotalPrice}`)
                },
                //图表
                updateChartData(){
                    const char  = this.list.map(item => ({value: item.pdprice * item.pdnum , name:item.pdname}))
                    this.myChart.setOption({
                        title: {
                          text: '消费比例',
                          subtext: '仅供参考',
                          left: 'center'
                        },
                        tooltip: {
                          trigger: 'item'
                        },
                        legend: {
                          orient: 'vertical',
                          left: 'left'
                        },
                        series: [
                          {
                            name: '产品',
                            type: 'pie',
                            radius: '50%',
                            data: char,
                            emphasis: {
                              itemStyle: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                              }
                            }
                          }
                        ]
                })
                }
               
            },
            watch:{
                list:{
                    deep:true,
                    handle(newValue){
                        localStorage.setItem('list',JSON.stringify(newValue))
                        this.updateChartData();
                    }
                }
            }
        })
    </script>  
</body>  
</html>
